<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Study Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #09090f; --card: #12111a; --card-hover: #1a1825;
    --accent: #9333ea; --accent-light: #c084fc; --accent2: #e879f9;
    --text: #f3f4f6; --muted: #9ca3af; --good: #10b981; --bad: #f43f5e;
    --border: #2e2a3a;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: 'Inter', system-ui, sans-serif; background: radial-gradient(circle at top right, #1a1425, #09090f); color: var(--text); min-height: 100vh; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: #4c1d95; }

  header { padding: 28px 32px; background: linear-gradient(135deg, #4c1d95, #9333ea, #c084fc); box-shadow: 0 4px 20px rgba(147, 51, 234, 0.3); border-bottom-left-radius: 24px; border-bottom-right-radius: 24px; border-bottom: 1px solid rgba(192, 132, 252, 0.3); }
  header h1 { margin:0; font-size: 2rem; font-family: 'Poppins', sans-serif; letter-spacing: -0.5px; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
  header p { margin: 6px 0 0; opacity: .95; font-size: .95rem; font-weight: 300; }

  .layout { display: flex; min-height: calc(100vh - 120px); gap: 24px; padding: 24px; }
  nav { width: 300px; background: var(--card); padding: 24px; border-radius: 20px; border: 1px solid var(--border); box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2); height: fit-content; position: sticky; top: 24px; }
  nav h3 { color: var(--accent-light); font-size: .8rem; text-transform: uppercase; letter-spacing: .1em; margin-bottom: 12px; font-weight: 600;}
  
  .note-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-radius: 12px; margin-bottom: 8px; cursor: pointer; font-size: .9rem; background: var(--bg); border: 1px solid var(--border); transition: all 0.2s ease; font-weight: 500; }
  .note-item:hover { background: var(--card-hover); border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
  .note-item.active { background: linear-gradient(135deg, var(--accent), var(--accent-light)); border-color: transparent; box-shadow: 0 6px 15px rgba(147, 51, 234, 0.4); }
  .note-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .delete-note-btn { background: transparent; border: none; color: var(--bad); cursor: pointer; font-size: 1rem; padding: 0 5px; opacity: 0.7; transition: opacity 0.2s; }
  .delete-note-btn:hover { opacity: 1; transform: scale(1.2); }

  main { flex: 1; max-width: 900px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
  .tab-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 10px 20px; border-radius: 30px; cursor: pointer; font-size: .85rem; font-weight: 500; transition: all 0.2s ease; }
  .tab-btn:hover { background: var(--card-hover); border-color: var(--accent); color: var(--accent-light); }
  .tab-btn.active { background: linear-gradient(135deg, var(--accent), var(--accent-light)); border-color: transparent; color: white; box-shadow: 0 6px 15px rgba(147, 51, 234, 0.4); }
  
  .panel { display: none; animation: fadeIn 0.4s ease-in-out; }
  .panel.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .card { background: var(--card); border-radius: 20px; padding: 24px; margin-bottom: 20px; border: 1px solid var(--border); box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2); }
  textarea, input[type=text] { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 12px; padding: 12px; font-size: .9rem; font-family: 'Inter', sans-serif; transition: all 0.2s ease; }
  textarea:focus, input[type=text]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(147, 51, 234, 0.2); }
  textarea { min-height: 120px; resize: vertical; }
  button.primary { background: linear-gradient(135deg, var(--accent), var(--accent-light)); color: white; border: none; padding: 12px 24px; border-radius: 12px; cursor: pointer; font-size: .9rem; margin-top: 12px; font-weight: 600; transition: all 0.2s ease; box-shadow: 0 4px 12px rgba(147, 51, 234, 0.3); }
  button.primary:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(147, 51, 234, 0.45); }
  button.primary:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }
  
  .mcq { border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 16px; background: var(--bg); transition: all 0.2s ease; }
  .mcq:hover { border-color: #4c1d95; }
  .option { display: block; padding: 12px 16px; border: 1px solid var(--border); border-radius: 10px; margin: 8px 0; cursor: pointer; transition: all 0.2s ease; background: var(--card); }
  .option:hover { background: var(--card-hover); border-color: var(--accent2); }
  .option.selected { border-color: var(--accent2); background: rgba(232, 121, 249, 0.1); }
  .option.correct { border-color: var(--good); background: rgba(16, 185, 129, 0.1); }
  .option.incorrect { border-color: var(--bad); background: rgba(244, 63, 94, 0.1); }
  
  .chat-log { max-height: 450px; overflow-y: auto; margin-bottom: 16px; padding-right: 8px; }
  .msg { padding: 12px 18px; border-radius: 18px; margin-bottom: 12px; max-width: 85%; line-height: 1.5; font-size: .95rem; }
  .msg.user { background: linear-gradient(135deg, var(--accent), var(--accent-light)); margin-left: auto; border-bottom-right-radius: 4px; color: white; box-shadow: 0 4px 8px rgba(147, 51, 234, 0.2); }
  .msg.bot { background: var(--card-hover); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  
  .muted { color: var(--muted); font-size: .9rem; line-height: 1.5; }
  .score-badge { display:inline-block; padding: 8px 20px; border-radius: 30px; background: linear-gradient(135deg, var(--accent2), var(--accent)); color: white; font-weight: bold; font-size: 1.1rem; box-shadow: 0 6px 15px rgba(232, 121, 249, 0.3); }
  ul.topics li { display:inline-block; background:rgba(147, 51, 234, 0.15); color: var(--accent-light); border: 1px solid rgba(147, 51, 234, 0.3); padding:6px 14px; border-radius:20px; margin:6px 6px 0 0; font-size:.8rem; font-weight: 500; }
  ul.topics { list-style:none; padding:0; }
  .upload-box { background: var(--bg); border: 1px dashed var(--border); padding: 16px; border-radius: 14px; margin-bottom: 12px; }

  /* Dashboard Styles */
  .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-bottom: 30px; }
  .stat-card { background: var(--card); padding: 24px; border-radius: 16px; border: 1px solid var(--border); text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: transform 0.2s ease; }
  .stat-card:hover { transform: translateY(-4px); border-color: var(--accent); }
  .stat-card h2 { font-size: 2.5rem; margin: 0; color: var(--accent-light); font-family: 'Poppins', sans-serif; }
  .stat-card p { margin: 8px 0 0; color: var(--muted); font-size: .9rem; font-weight: 500; }
  .recent-note-card { background: var(--card); padding: 20px; border-radius: 16px; border: 1px solid var(--border); cursor: pointer; transition: all 0.2s ease; }
  .recent-note-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
  .recent-note-card h4 { margin: 0; font-size: 1.1rem; color: var(--text); }
  .recent-note-card p { margin: 8px 0 0; font-size: 0.8rem; color: var(--accent2); }

  /* Flashcard 3D Flip Styles */
  .flashcard-container { width: 100%; max-width: 320px; height: 200px; perspective: 1000px; margin: 0 auto 20px auto; }
  .flashcard { width: 100%; height: 100%; position: relative; transition: transform 0.6s; transform-style: preserve-3d; cursor: pointer; }
  .flashcard.flipped { transform: rotateY(180deg); }
  .flashcard-front, .flashcard-back { position: absolute; width: 100%; height: 100%; -webkit-backface-visibility: hidden; backface-visibility: hidden; border-radius: 14px; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; box-shadow: 0 6px 10px rgba(0,0,0,0.2); border: 1px solid var(--border); }
  .flashcard-front { background: var(--bg); color: var(--accent-light); font-weight: 600; font-size: 1.2rem; }
  .flashcard-back { background: linear-gradient(135deg, var(--accent), var(--accent-light)); color: white; transform: rotateY(180deg); font-size: 1rem; line-height: 1.5; }
</style>
</head>
<body>

<header>
  <h1>📚 AI Study Assistant</h1>
  <p>Upload notes, understand, and practice — all in one place</p>
</header>

<div class="layout">
  <nav>
    <button class="primary" id="dashboardBtn" style="width:100%; margin-bottom: 16px; background: linear-gradient(135deg, #2e2a3a, #4c1d95);">🏠 Back to Dashboard</button>
    
    <h3>+ New Note</h3>
    <div class="upload-box">
      <input type="text" id="titleInput" placeholder="Title (optional)" style="margin-bottom:10px">
      <input type="file" id="fileInput" style="margin-bottom:10px; font-size: 0.8rem;" accept=".pdf,.txt">
      <textarea id="textInput" placeholder="...or paste text directly here" style="min-height:80px"></textarea>
    </div>
    <button class="primary" id="uploadBtn" style="width:100%; margin-top:0">Upload</button>
    
    <h3 style="margin-top:24px">My Notes</h3>
    <div id="notesList"></div>
  </nav>

  <main>
    <!-- DASHBOARD VIEW -->
    <div id="dashboard">
      <div class="card" style="text-align: center; margin-bottom: 30px;">
        <h2 style="margin: 0; font-family: 'Poppins', sans-serif; color: var(--text);">Welcome back! 👋</h2>
        <p style="color: var(--muted); margin-top: 12px; font-size: 1rem;">Upload your study material to generate summaries, flashcards, quizzes, and more.</p>
      </div>
      
      <div class="dashboard-grid">
        <div class="stat-card">
          <h2 id="statNotes">0</h2>
          <p>Total Notes</p>
        </div>
        <div class="stat-card">
          <h2 id="statQuizzes">0</h2>
          <p>Quizzes Taken</p>
        </div>
        <div class="stat-card">
          <h2 id="statChats">0</h2>
          <p>AI Chats</p>
        </div>
      </div>
      
      <h3 style="color: var(--accent-light); margin-bottom: 16px;">Recent Notes</h3>
      <div id="recentNotesList" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;"></div>
    </div>

    <!-- WORKSPACE VIEW -->
    <div id="workspace" style="display:none">
      <div class="tabs">
        <button class="tab-btn active" data-tab="summary">Summary</button>
        <button class="tab-btn" data-tab="questions">Questions</button>
        <button class="tab-btn" data-tab="mcq">MCQ Quiz</button>
        <button class="tab-btn" data-tab="flashcards">Flashcards</button>
        <button class="tab-btn" data-tab="chat">Ask My Notes</button>
      </div>

      <div class="panel active" id="panel-summary">
        <div class="card">
          <button class="primary" id="genSummaryBtn">Generate Summary</button>
          <div id="summaryResult" style="margin-top:16px"></div>
        </div>
      </div>

      <div class="panel" id="panel-questions">
        <div class="card">
          <button class="primary" id="genQuestionsBtn">Generate Practice Questions</button>
          <div id="questionsResult" style="margin-top:16px"></div>
        </div>
      </div>

      <div class="panel" id="panel-mcq">
        <div class="card">
          <button class="primary" id="genMcqBtn">Generate MCQ Quiz</button>
          <button class="primary" id="submitQuizBtn" style="display:none; background:linear-gradient(135deg, #e879f9, #9333ea); margin-left:10px;">Submit Quiz</button>
          <div id="mcqResult" style="margin-top:16px"></div>
          <div id="quizScore" style="margin-top:16px"></div>
        </div>
      </div>

      <div class="panel" id="panel-flashcards">
        <div class="card">
          <button class="primary" id="genFlashcardsBtn">Generate Flashcards</button>
          <div id="flashcardsResult" style="margin-top:24px; display: flex; flex-wrap: wrap; gap: 20px;"></div>
        </div>
      </div>

      <div class="panel" id="panel-chat">
        <div class="card">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <h3 style="margin: 0; font-size: 1.1rem; color: var(--text);">Chat History</h3>
            <button class="primary" id="clearChatBtn" style="background: linear-gradient(135deg, #f43f5e, #b91c1c); margin-top: 0; padding: 8px 16px; font-size: 0.8rem;">Clear History</button>
          </div>
          <div class="chat-log" id="chatLog"></div>
          <div style="display:flex; gap:10px">
            <input type="text" id="chatInput" placeholder="Ask anything about your notes...">
            <button class="primary" id="sendChatBtn" style="margin-top:0">Send</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
let currentNoteId = null;
let currentMcqs = [];
let selectedAnswers = {};

async function api(url, opts={}) {
  const res = await fetch(url, opts);
  const text = await res.text();
  try {
    const data = JSON.parse(text);
    if (!res.ok) throw new Error(data.error || 'Something went wrong');
    return data;
  } catch (e) {
    if (text.startsWith('<')) throw new Error('Backend Python crash! Check terminal.');
    throw new Error('Server error: ' + text);
  }
}

async function loadStats() {
  try {
    const stats = await api('/api/stats');
    document.getElementById('statNotes').innerText = stats.total_notes;
    document.getElementById('statQuizzes').innerText = stats.total_quizzes;
    document.getElementById('statChats').innerText = stats.total_chats;
  } catch (e) { console.error("Failed to load stats"); }
}

async function loadNotes() {
  const notes = await api('/api/notes');
  const list = document.getElementById('notesList');
  const recentList = document.getElementById('recentNotesList');
  
  list.innerHTML = '';
  recentList.innerHTML = '';

  if (notes.length === 0) {
    recentList.innerHTML = '<p class="muted">No notes uploaded yet. Use the panel on the left to get started!</p>';
  } else {
    notes.slice(0, 3).forEach(n => {
      const card = document.createElement('div');
      card.className = 'recent-note-card';
      card.onclick = () => selectNote(n.id);
      card.innerHTML = `<h4>${n.title}</h4><p>Click to open &rarr;</p>`;
      recentList.appendChild(card);
    });
  }

  notes.forEach(n => {
    const wrapper = document.createElement('div');
    wrapper.className = 'note-item' + (n.id === currentNoteId ? ' active' : '');
    wrapper.onclick = () => selectNote(n.id);
    
    const text = document.createElement('div');
    text.className = 'note-title';
    text.textContent = n.title;
    
    const delBtn = document.createElement('button');
    delBtn.className = 'delete-note-btn';
    delBtn.innerHTML = '🗑️';
    delBtn.onclick = (e) => {
      e.stopPropagation();
      deleteNote(n.id, n.title);
    };
    
    wrapper.appendChild(text);
    wrapper.appendChild(delBtn);
    list.appendChild(wrapper);
  });
}

async function deleteNote(id, title) {
  if (!confirm(`Are you sure you want to delete "${title}"? All flashcards, quizzes, and chats for this note will be permanently deleted.`)) return;
  try {
    await api(`/api/notes/${id}/delete`, { method: 'POST' });
    if (currentNoteId === id) {
      showDashboard(); 
    }
    await loadNotes();
    await loadStats();
  } catch (e) { alert(e.message); }
}

function showDashboard() {
  currentNoteId = null;
  document.getElementById('dashboard').style.display = 'block';
  document.getElementById('workspace').style.display = 'none';
  loadNotes();
  loadStats();
}

document.getElementById('dashboardBtn').onclick = () => {
  showDashboard();
};

function selectNote(id) {
  currentNoteId = id;
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('workspace').style.display = 'block';
  document.getElementById('summaryResult').innerHTML = '';
  document.getElementById('questionsResult').innerHTML = '';
  document.getElementById('mcqResult').innerHTML = '';
  document.getElementById('quizScore').innerHTML = '';
  document.getElementById('flashcardsResult').innerHTML = '';
  document.getElementById('chatLog').innerHTML = '';
  document.getElementById('submitQuizBtn').style.display = 'none';
  currentMcqs = []; selectedAnswers = {};
  loadNotes();
  loadChatHistory();
}

document.getElementById('uploadBtn').onclick = async () => {
  const title = document.getElementById('titleInput').value;
  const text = document.getElementById('textInput').value;
  const file = document.getElementById('fileInput').files[0];
  if (!text && !file) { alert('Please provide a file or text!'); return; }

  const fd = new FormData();
  fd.append('title', title);
  fd.append('text', text);
  if (file) fd.append('file', file);

  const btn = document.getElementById('uploadBtn');
  btn.disabled = true; btn.textContent = 'Uploading...';
  try {
    const data = await api('/api/upload', { method: 'POST', body: fd });
    document.getElementById('titleInput').value = '';
    document.getElementById('textInput').value = '';
    document.getElementById('fileInput').value = '';
    await loadNotes();
    await loadStats();
    selectNote(data.id);
  } catch (e) { alert(e.message); }
  btn.disabled = false; btn.textContent = 'Upload';
};

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  };
});

document.getElementById('genSummaryBtn').onclick = async () => {
  const btn = document.getElementById('genSummaryBtn');
  const out = document.getElementById('summaryResult');
  btn.disabled = true; btn.textContent = 'Generating...'; out.innerHTML = '<p class="muted">Please wait...</p>';
  try {
    const data = await api(`/api/notes/${currentNoteId}/summary`, { method: 'POST' });
    const topics = data.topics ? data.topics.split(',').map(t => `<li>${t.trim()}</li>`).join('') : '';
    out.innerHTML = `<p style="white-space:pre-wrap; line-height: 1.6;">${data.summary}</p>
      ${topics ? `<h4 style="margin-top:20px; color: var(--text);">Important Topics</h4><ul class="topics">${topics}</ul>` : ''}`;
  } catch (e) { out.innerHTML = `<p class="muted">${e.message}</p>`; }
  btn.disabled = false; btn.textContent = 'Generate Summary';
};

document.getElementById('genQuestionsBtn').onclick = async () => {
  const btn = document.getElementById('genQuestionsBtn');
  const out = document.getElementById('questionsResult');
  btn.disabled = true; btn.textContent = 'Generating...'; out.innerHTML = '<p class="muted">Please wait...</p>';
  try {
    const data = await api(`/api/notes/${currentNoteId}/questions`, {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({count: 8})
    });
    out.innerHTML = data.map((q,i) => `
      <div class="card" style="padding:20px; margin-bottom:16px;">
        <b style="font-size: 1.1rem; color: var(--accent-light);">Q${i+1} (${q.type}):</b> ${q.question}
        <textarea class="answer-input" data-question="${q.question.replace(/"/g, '&quot;')}" placeholder="Type your answer here..." style="min-height: 100px; margin-top: 12px;"></textarea>
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button class="primary check-answer-btn" style="background: linear-gradient(135deg, #10b981, #059669); margin-top: 0;">Check Answer</button>
            <button class="primary toggle-hint-btn" style="background: linear-gradient(135deg, #2e2a3a, #4c1d95); margin-top: 0;">Show Hint</button>
        </div>
        <div class="feedback-box muted" style="display:none; margin-top:12px; padding:14px; background:var(--bg); border-radius:10px; border:1px solid var(--border);"></div>
        <div class="hint-box muted" style="display:none; margin-top:12px; padding:14px; background:var(--bg); border-radius:10px; border:1px solid var(--border);">💡 ${q.answer_hint || 'No hint provided.'}</div>
      </div>`).join('');
  } catch (e) { out.innerHTML = `<p class="muted">${e.message}</p>`; }
  btn.disabled = false; btn.textContent = 'Generate Practice Questions';
};

document.getElementById('questionsResult').addEventListener('click', async function(e) {
  const target = e.target;
  if (!target.classList.contains('primary')) return;
  const card = target.closest('.card');
  if (target.classList.contains('toggle-hint-btn')) {
    const box = card.querySelector('.hint-box');
    if (box.style.display === 'none' || box.style.display === '') { box.style.display = 'block'; target.textContent = 'Hide Hint'; }
    else { box.style.display = 'none'; target.textContent = 'Show Hint'; }
  } else if (target.classList.contains('check-answer-btn')) {
    const textarea = card.querySelector('.answer-input');
    const feedbackBox = card.querySelector('.feedback-box');
    const question = textarea.dataset.question;
    const answer = textarea.value.trim();
    if (!answer) { alert('Please type an answer first!'); return; }
    target.disabled = true; target.textContent = 'Checking...';
    feedbackBox.style.display = 'block';
    feedbackBox.innerHTML = 'Evaluating your answer...';
    try {
      const res = await api(`/api/notes/${currentNoteId}/check_answer`, {
        method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ question: question, answer: answer })
      });
      if (res.is_correct) feedbackBox.innerHTML = `✅ <b style="color: #10b981;">Correct!</b> ${res.feedback}`;
      else feedbackBox.innerHTML = `❌ <b style="color: #f43f5e;">Incorrect/Incomplete.</b> ${res.feedback}`;
    } catch (err) { feedbackBox.innerHTML = `<span style="color: #f43f5e;">${err.message}</span>`; }
    target.disabled = false; target.textContent = 'Check Answer';
  }
});

document.getElementById('genFlashcardsBtn').onclick = async () => {
  const btn = document.getElementById('genFlashcardsBtn');
  const out = document.getElementById('flashcardsResult');
  btn.disabled = true; btn.textContent = 'Generating...'; out.innerHTML = '<p class="muted">Please wait...</p>';
  try {
    const data = await api(`/api/notes/${currentNoteId}/flashcards`, {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({count: 6})
    });
    
    if (!Array.isArray(data) || data.length === 0) {
        throw new Error("The AI didn't return any valid flashcards. Please try again.");
    }

    out.innerHTML = data.map((c, i) => `
      <div class="flashcard-container">
        <div class="flashcard" id="card-${i}">
          <div class="flashcard-front">${c.term}</div>
          <div class="flashcard-back">${c.definition}</div>
        </div>
      </div>`).join('');
    
    document.querySelectorAll('.flashcard').forEach(card => {
      card.addEventListener('click', () => card.classList.toggle('flipped'));
    });

  } catch (e) { out.innerHTML = `<p class="muted">${e.message}</p>`; }
  btn.disabled = false; btn.textContent = 'Generate Flashcards';
};

document.getElementById('genMcqBtn').onclick = async () => {
  const btn = document.getElementById('genMcqBtn');
  const out = document.getElementById('mcqResult');
  document.getElementById('quizScore').innerHTML = '';
  btn.disabled = true; btn.textContent = 'Generating...'; out.innerHTML = '<p class="muted">Please wait...</p>';
  selectedAnswers = {};
  try {
    const data = await api(`/api/notes/${currentNoteId}/mcq`, {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({count: 5})
    });
    currentMcqs = data;
    renderMcqs();
    document.getElementById('submitQuizBtn').style.display = 'inline-block';
  } catch (e) { out.innerHTML = `<p class="muted">${e.message}</p>`; }
  btn.disabled = false; btn.textContent = 'Generate MCQ Quiz';
};

function renderMcqs() {
  const out = document.getElementById('mcqResult');
  out.innerHTML = currentMcqs.map((m, i) => `
    <div class="mcq">
      <b style="font-size: 1.1rem;">Q${i+1}.</b> ${m.question}
      ${['a','b','c','d'].map(opt => `
        <div class="option" data-mcq="${m.id}" data-opt="${opt}" onclick="selectOption(${m.id}, '${opt}')">
          <b>${opt.toUpperCase()}.</b> ${m['option_' + opt]}
        </div>`).join('')}
    </div>`).join('');
}

function selectOption(mcqId, opt) {
  selectedAnswers[mcqId] = opt;
  document.querySelectorAll(`.option[data-mcq="${mcqId}"]`).forEach(el => {
    el.classList.toggle('selected', el.dataset.opt === opt);
  });
}

document.getElementById('submitQuizBtn').onclick = async () => {
  try {
    const data = await api(`/api/notes/${currentNoteId}/quiz/submit`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ answers: selectedAnswers })
    });
    document.getElementById('quizScore').innerHTML = `<span class="score-badge">Score: ${data.score} / ${data.total}</span>`;
    data.review.forEach((r, i) => {
      document.querySelectorAll('.mcq')[i].querySelectorAll('.option').forEach(el => {
        if (el.dataset.opt === r.correct_answer) el.classList.add('correct');
        else if (el.dataset.opt === r.your_answer) el.classList.add('incorrect');
      });
    });
    loadStats(); 
  } catch (e) { alert(e.message); }
};

async function loadChatHistory() {
  const hist = await api(`/api/notes/${currentNoteId}/chat/history`);
  const log = document.getElementById('chatLog');
  log.innerHTML = hist.map(h => `<div class="msg user">${h.question}</div><div class="msg bot">${h.answer}</div>`).join('');
  log.scrollTop = log.scrollHeight;
}

document.getElementById('clearChatBtn').onclick = async () => {
    if (!currentNoteId) return;
    if (!confirm('Are you sure you want to delete all chat history for this note?')) return;
    try {
        await api(`/api/notes/${currentNoteId}/chat/clear`, { method: 'POST' });
        document.getElementById('chatLog').innerHTML = '';
        loadStats(); 
    } catch (e) { alert(e.message); }
};

document.getElementById('sendChatBtn').onclick = sendChat;
document.getElementById('chatInput').addEventListener('keydown', e => { if (e.key === 'Enter') sendChat(); });

async function sendChat() {
  const input = document.getElementById('chatInput');
  const q = input.value.trim();
  if (!q) return;
  const log = document.getElementById('chatLog');
  log.innerHTML += `<div class="msg user">${q}</div>`;
  input.value = '';
  log.scrollTop = log.scrollHeight;
  try {
    const data = await api(`/api/notes/${currentNoteId}/chat`, {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ question: q })
    });
    log.innerHTML += `<div class="msg bot">${data.answer}</div>`;
    log.scrollTop = log.scrollHeight;
    loadStats(); 
  } catch (e) { alert(e.message); }
}

showDashboard();
</script>
</body>
</html>
